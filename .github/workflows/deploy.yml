name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Grant the workflow permission to publish to GitHub Pages via the deploy-pages action.
# `deployments: read` is for the stale-deployment sweep in the deploy job below.
permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

# Only one Pages deployment at a time — but never cancel one that is already running.
# A Pages deployment needs a few uninterrupted minutes to be served, and cancelling
# it half-way is how a retry kills the attempt before it: push, re-run, push again,
# and nothing ever finishes. GitHub's own Pages workflow sets this to false for
# exactly that reason.
#
# This does not queue up and jam. GitHub keeps at most one PENDING run per group and
# a newer pending run supersedes the older pending one, so at most one deployment
# waits behind the one in flight.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:run

      - name: Build the app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages serves one deployment at a time, so one that is still open blocks
      # every later one — the next run gets a 400 telling it to "cancel <sha>
      # first". A runner that goes away mid-deployment (a cancelled job) can
      # leave one open with nobody left to finalise it, and nothing clears it on
      # its own. This sweeps any that are still pending before deploying.
      #
      # Kept as insurance, not as a diagnosis: the 06.08.2026 outage looked like
      # this and was not. Every deployment since 11:33 that day was already
      # terminal by the time the next run started, so this step had nothing to
      # cancel and the site still did not update. See the deploy-pages step below.
      #
      # It is a tidy-up, never a gate — we skip this run's own sha, only touch
      # deployments Pages has not finished with, and if the API is unreachable or
      # answers oddly every branch falls through to doing nothing.
      - name: Cancel any Pages deployment left pending by an earlier run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=10" \
            --jq '.[] | select(.sha != env.GITHUB_SHA) | "\(.id) \(.sha)"' 2>/dev/null |
          while read -r id sha; do
            # No status at all means it never even reported queued — still pending.
            # 'unknown' is the read-failed case, and matches nothing below.
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" \
              --jq '.[0].state // "pending"' 2>/dev/null || echo unknown)
            case "$state" in
              pending|queued|in_progress|waiting)
                echo "Cancelling $sha, left '$state' by an earlier run"
                if gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" >/dev/null 2>&1
                then echo "  cancelled"
                else echo "  nothing to cancel (already resolved)"
                fi
                ;;
            esac
          done

      # Do not add `timeout:` here expecting a longer wait. The action clamps it —
      # `this.timeout = Math.min(timeoutInput, MAX_TIMEOUT)` with MAX_TIMEOUT =
      # 600000 — so anything above ten minutes is silently reduced and only earns
      # a warning in the log. Waiting longer than ten minutes means looping the
      # step yourself, not passing a bigger number.
      #
      # The 06.08.2026 outage was not this repo. Every deployment from 11:33 ran
      # waiting → queued → in_progress and then stopped, and deploy-pages wrote
      # the 'failure' itself when its poll gave up. GitHub had Pages at
      # major_outage with an open incident that day. The repo was never at fault:
      # 690d93c has source byte-identical to e349042, which published fine at
      # 08:25 the same morning, and 690d93c still failed twice.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
