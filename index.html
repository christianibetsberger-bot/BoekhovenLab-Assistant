<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lab Assistant by CTI</title>

    <!-- PWA / macOS web app -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0E396E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lab Assistant" />

    <!-- Icons (dynamically updated at runtime to match the user's theme color) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Home-screen icon (iOS) — light & dark variants -->
    <link rel="apple-touch-icon" href="/apple-touch-light.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" href="/apple-touch-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-light.png" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cryo label typography (IBM Plex Sans Condensed 700 + IBM Plex Mono); falls back to system condensed/mono if offline -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@700&display=swap">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
