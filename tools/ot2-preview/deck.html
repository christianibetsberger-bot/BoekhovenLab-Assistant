<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OT-2 deck map candidates</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    body { margin: 0; padding: 24px; }
    .row { display: flex; gap: 24px; align-items: flex-start; }
    .cell { width: 340px; padding: 14px; border-radius: 12px; background: var(--fl); border: 1px solid var(--ln2); }
    .cap { font: 600 12px system-ui; color: var(--tx2); margin-bottom: 8px; }
    h1 { font: 700 15px system-ui; color: var(--tx); margin: 0 0 12px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./deck.js"></script>
</body>
</html>
